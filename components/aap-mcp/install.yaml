---
- name: Check Ansible Automation Platform instance exists
  kubernetes.core.k8s_info:
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ aap_mcp.instance_name }}"
    namespace: "{{ aap_mcp.namespace }}"
  register: aap_instance

- name: Fail when Ansible Automation Platform instance is missing
  ansible.builtin.fail:
    msg: >-
      AnsibleAutomationPlatform/{{ aap_mcp.instance_name }} not found in
      namespace {{ aap_mcp.namespace }}. Deploy AAP before installing aap-mcp.
  when: aap_instance.resources | length == 0

- name: Wait for AAP gateway status and set connection facts
  ansible.builtin.include_tasks: "{{ playbook_dir }}/components/aap-mcp/wait_gateway_status.yml"

- name: Check for existing AnsibleMCPServer custom resources
  kubernetes.core.k8s_info:
    api_version: mcpserver.ansible.com/v1alpha1
    kind: AnsibleMCPServer
    namespace: "{{ aap_mcp.namespace }}"
  register: aap_mcp_existing_cr_list

- name: Check AAP MCP Deployment availability when MCP CR exists
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ aap_mcp_existing_cr_list.resources[0].metadata.name }}"
    namespace: "{{ aap_mcp.namespace }}"
  register: aap_mcp_existing_deployment
  when: aap_mcp_existing_cr_list.resources | length > 0

- name: Set AAP MCP install skip fact
  ansible.builtin.set_fact:
    aap_mcp_install_skip: >-
      {{
        (aap_mcp_existing_cr_list.resources | default([]) | length > 0)
        and (aap_mcp_existing_deployment.resources | default([]) | length > 0)
        and (aap_mcp_existing_deployment.resources[0].status.availableReplicas | default(0) | int > 0)
      }}
    aap_mcp_cr_name: "{{ aap_mcp_existing_cr_list.resources[0].metadata.name }}"
    aap_mcp_deployment_name: "{{ aap_mcp_existing_cr_list.resources[0].metadata.name }}"
  when:
    - aap_mcp_existing_cr_list.resources | length > 0
    - aap_mcp_existing_deployment is defined
    - aap_mcp_existing_deployment.resources | default([]) | length > 0
    - aap_mcp_existing_deployment.resources[0].status.availableReplicas | default(0) | int > 0

- name: Set AAP MCP install skip fact when MCP is not ready
  ansible.builtin.set_fact:
    aap_mcp_install_skip: false
  when: aap_mcp_install_skip is not defined

- name: Install and reconcile AAP MCP when not already running
  when: not aap_mcp_install_skip | bool
  ansible.builtin.include_tasks: "{{ playbook_dir }}/components/aap-mcp/install-reconcile.yml"

- name: Skip AAP MCP install when server is already running
  ansible.builtin.debug:
    msg: >-
      AAP MCP is already running in namespace {{ aap_mcp.namespace }}
      (AnsibleMCPServer/{{ aap_mcp_cr_name }}). Skipping operator reconcile.
  when: aap_mcp_install_skip | bool

- name: Get AAP MCP Service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: "{{ aap_mcp_deployment_name }}"
    namespace: "{{ aap_mcp.namespace }}"
  register: aap_mcp_service

- name: Set AAP MCP service port
  ansible.builtin.set_fact:
    aap_mcp_service_port: >-
      {{
        (
          aap_mcp_service.resources[0].spec.ports
          | selectattr('name', 'equalto', 'http')
          | map(attribute='port')
          | list
          | first
        )
        | default(aap_mcp_service.resources[0].spec.ports[0].port, true)
      }}
  when: aap_mcp_service.resources | length > 0

- name: Set default AAP MCP URL
  ansible.builtin.set_fact:
    aap_mcp_effective_url: >-
      {{
        aap_mcp.url
        | default(
            'http://' ~ aap_mcp.instance_name ~ '-mcp.' ~ aap_mcp.namespace ~ '.svc:'
            ~ (aap_mcp_service_port | default(aap_mcp.port | default(8086)) | string) ~ '/mcp/',
            true
          )
      }}

- name: Ensure AAP MCP OAuth token exists and is valid
  ansible.builtin.include_tasks: "{{ playbook_dir }}/components/aap-mcp/ensure_token.yml"

- name: Propagate discovered AAP MCP connection details
  ansible.builtin.set_fact:
    aap_mcp: >-
      {{
        aap_mcp | combine({
          'port': aap_mcp_service_port | default(aap_mcp.port | default(8086)),
          'url': aap_mcp_effective_url,
          'token': aap_mcp_token_value
        }, recursive=True)
      }}

- name: Show AAP MCP connection details
  ansible.builtin.debug:
    msg:
      - "AAP MCP URL: {{ aap_mcp.url }}"
      - "AAP MCP token: created (stored in secret {{ aap_mcp.token_secret_name }})"
