---
- name: Configure AAP Apache httpd deployment workflow
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../vars.yaml
  tasks:
    - name: Load AAP CASC group variables
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../../group_vars/all"
        extensions:
          - yml

    - name: Discover platform connection facts
      ansible.builtin.include_role:
        name: aap-platform-facts

    - name: Refresh AAP Apache httpd deployment workflow
      ansible.builtin.include_role:
        name: aap-httpd-pipeline
