---
- name: Configure AAP VM provisioning workflow
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../vars.yaml
    - ../../group_vars/all/aap_vm_pipeline.yml
    - ../../group_vars/all/itsm_apache_stack.yml
  tasks:
    - name: Discover platform connection facts
      ansible.builtin.include_role:
        name: aap-platform-facts

    - name: Refresh AAP Provision VM workflow
      ansible.builtin.include_role:
        name: aap-vm-pipeline
