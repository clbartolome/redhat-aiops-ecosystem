---
- name: Fix ITSM chat notifications (credential URL and job template)
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../vars.yaml
  tasks:
    - name: Load AAP CASC group variables
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../../group_vars/all"
        extensions:
          - yml

    - name: Discover platform connection facts
      ansible.builtin.include_role:
        name: aap-platform-facts

    - name: Ensure VM SSH keys are available for AAP CASC preflight
      ansible.builtin.include_role:
        name: aiops-demo-prep

    - name: Refresh AAP credentials (Chat App URL on port 5000)
      ansible.builtin.include_role:
        name: aap-casc

    - name: Refresh Publish ITSM Chat Notification job template
      ansible.builtin.include_role:
        name: aap-itsm-chat-pipeline
