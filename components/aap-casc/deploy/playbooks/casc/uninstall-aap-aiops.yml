---
- name: Remove AAP CASC for AIOps demo
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../../../vars.yaml

  tasks:
    - name: Ensure OpenShift API access is available
      ansible.builtin.include_tasks:
        file: tasks/ensure_openshift_access.yml

    - name: Run AAP CASC uninstall tasks
      ansible.builtin.include_tasks:
        file: uninstall-tasks.yml
