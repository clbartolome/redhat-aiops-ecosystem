---
- name: Start ITSM change task tracking
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Start ITSM CTASK for Start httpd
      ansible.builtin.import_role:
        name: itsm_change_task
        tasks_from: start.yml

    - name: Resolve target host for Apache stack job
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_apache_app_target_host.yml

- name: Start httpd on target server
  hosts: apache_app_targets
  gather_facts: true
  become: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Enable and start httpd service
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: start

- name: Complete ITSM change task tracking
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Complete ITSM CTASK for Start httpd
      ansible.builtin.import_role:
        name: itsm_change_task
        tasks_from: complete.yml

    - name: Load chat-app credentials for deployment completion post
      ansible.builtin.include_role:
        name: common
        tasks_from: load_chat_credential.yml
      when:
        - apache_stack_post_chat_summary | default(true) | bool
        - itsm_change_task_completion_comment | default('') | string | trim | length > 0
        - (thread_id | default(chat_thread_id | default(''), true)) | string | trim | length > 0

    - name: Post Generic Application stack deployment completion to chat agent thread
      ansible.builtin.include_role:
        name: common
        tasks_from: post_chat_deployment_completion.yml
      when:
        - apache_stack_post_chat_summary | default(true) | bool
        - itsm_change_task_completion_comment | default('') | string | trim | length > 0
        - (thread_id | default(chat_thread_id | default(''), true)) | string | trim | length > 0

    - name: Skip chat notification when agent thread id is unavailable
      ansible.builtin.debug:
        msg: >-
          thread_id is missing; skipping deployment completion post to chat.
          Launch Deploy Generic Application Stack from the chat agent thread so thread_id is injected.
          Set apache_stack_post_chat_summary: false to silence this notice.
      when:
        - apache_stack_post_chat_summary | default(true) | bool
        - itsm_change_task_completion_comment | default('') | string | trim | length > 0
        - (thread_id | default(chat_thread_id | default(''), true)) | string | trim | length == 0

    - name: Skip chat notification when deployment chat posts are disabled
      ansible.builtin.debug:
        msg: Deployment chat summary posting is disabled (apache_stack_post_chat_summary=false).
      when: not (apache_stack_post_chat_summary | default(true) | bool)
