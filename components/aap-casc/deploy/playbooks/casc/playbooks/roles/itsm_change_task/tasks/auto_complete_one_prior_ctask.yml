---
- name: Start prior pending CTASK before current milestone
  ansible.builtin.uri:
    url: >-
      {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/changes/{{
      itsm_change_ref | urlencode }}/tasks/{{ itsm_prior_ctask_item.public_id | urlencode }}/start
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_change_task_validate_certs }}"
    body_format: json
    body: {}
    status_code: [200, 400]
    return_content: true
    headers:
      Accept: application/json
      Content-Type: application/json
  register: itsm_prior_ctask_start
  failed_when: >-
    itsm_prior_ctask_start.status == 400
    and ('cannot be started' not in (itsm_prior_ctask_start.json.detail | default('') | lower))
    and ('in progress' not in (itsm_prior_ctask_start.json.detail | default('') | lower))
    and ('complete prior' not in (itsm_prior_ctask_start.json.detail | default('') | lower))

- name: Complete prior pending CTASK before current milestone
  ansible.builtin.uri:
    url: >-
      {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/changes/{{
      itsm_change_ref | urlencode }}/tasks/{{ itsm_prior_ctask_item.public_id | urlencode }}/complete
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_change_task_validate_certs }}"
    body_format: json
    body:
      comment: "{{ itsm_change_task_auto_complete_comment }}"
    status_code: [200, 400]
    return_content: true
    headers:
      Accept: application/json
      Content-Type: application/json
  register: itsm_prior_ctask_complete
  failed_when: >-
    itsm_prior_ctask_complete.status == 400
    and ('in progress to complete' not in (itsm_prior_ctask_complete.json.detail | default('') | lower))
    and ('already complete' not in (itsm_prior_ctask_complete.json.detail | default('') | lower))
    and ('already completed' not in (itsm_prior_ctask_complete.json.detail | default('') | lower))
