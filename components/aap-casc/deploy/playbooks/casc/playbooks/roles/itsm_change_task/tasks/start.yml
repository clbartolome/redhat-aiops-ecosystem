---
- name: Evaluate ITSM change task integration for this workflow node
  ansible.builtin.include_tasks: evaluate_enabled.yml

- name: Auto-complete pending CTASKs that precede the current milestone
  ansible.builtin.include_tasks: auto_complete_prior_ctasks.yml
  when:
    - itsm_change_task_enabled | bool
    - itsm_change_task_track_milestones_only | default(false) | bool

- name: Run ITSM change task preflight
  ansible.builtin.include_tasks: preflight.yml
  when: itsm_change_task_enabled | bool

- name: Resolve ITSM CTASK for this workflow node
  ansible.builtin.include_tasks: resolve_ctask.yml
  when: itsm_change_task_enabled | bool

- name: Start ITSM CTASK
  ansible.builtin.include_tasks: start_ctask.yml
  when: itsm_change_task_enabled | bool
