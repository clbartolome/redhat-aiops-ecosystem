---
- name: Generate random VM password
  ansible.builtin.set_fact:
    password: >-
      {{
        lookup(
          'ansible.builtin.password',
          '/dev/null',
          length=vm_manifest_password_length,
          chars=['ascii_letters', 'digits']
        )
      }}
  no_log: true

- name: Ensure VM manifest work directory exists
  ansible.builtin.file:
    path: "{{ vm_manifest_workdir }}/{{ vm_manifest_gitea_path }}"
    state: directory
    mode: "0750"

- name: Resolve Apache exposure port for initial VM manifest
  ansible.builtin.set_fact:
    vm_manifest_service_port: "{{ (apache_exposure_service_port | default(80)) | int }}"

- name: Derive Apache Service and Route naming for initial VM manifest
  ansible.builtin.set_fact:
    vm_manifest_service_name: "{{ vm_name }}-http"
    vm_manifest_route_name: "{{ vm_name }}-http"
    vm_manifest_route_host: "{{ vm_name }}-http.{{ openshift_cluster_domain }}"
  when: openshift_cluster_domain | default('') | string | trim | length > 0

- name: Render VM manifest from template
  ansible.builtin.template:
    src: "{{ vm_manifest_template_file | default(playbook_dir ~ '/templates/vm_template.yaml.j2') }}"
    dest: "{{ vm_manifest_workdir }}/{{ vm_manifest_gitea_path }}/{{ vm_name }}.yaml"
    mode: "0640"
