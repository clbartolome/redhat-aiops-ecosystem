---
- name: Build VM modification chat completion summary
  ansible.builtin.set_fact:
    vm_modification_chat_summary: >-
      {{
        (
          vm_name | string | trim
          ~ ' CPUs updated to '
          ~ (cpus | string)
          ~ '. '
          ~ (itsm_change_task_completion_comment | default('') | replace('\n', ' '))
        )
        if (vm_modification_completion_kind | default('') == 'cpu')
        else (
          vm_name | string | trim
          ~ ' memory updated to '
          ~ (mem | string)
          ~ ' GiB. '
          ~ (itsm_change_task_completion_comment | default('') | replace('\n', ' '))
        )
      }}

- name: Post service request completion to chat agent thread
  ansible.builtin.include_role:
    name: common
    tasks_from: post_chat_thread_info.yml
  vars:
    chat_thread_info_message: >-
      [request.complete] {{ itsm_service_request_ref | string | trim }} —
      {{ vm_modification_chat_summary }}
