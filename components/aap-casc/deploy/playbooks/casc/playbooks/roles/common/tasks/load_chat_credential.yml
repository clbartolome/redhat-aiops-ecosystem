---
- name: Resolve chat connection facts from AAP credential injection
  ansible.builtin.set_fact:
    chat_app_url: "{{ chat_app_url | default(lookup('ansible.builtin.env', 'CHAT_APP_URL', default=''), true) }}"
    chat_app_username: "{{ chat_app_username | default(lookup('ansible.builtin.env', 'CHAT_APP_USERNAME', default=''), true) }}"
    chat_app_password: "{{ chat_app_password | default(lookup('ansible.builtin.env', 'CHAT_APP_PASSWORD', default=''), true) }}"
  when: >-
    (chat_app_url is defined and chat_app_url | string | trim | length > 0)
    or (lookup('ansible.builtin.env', 'CHAT_APP_URL', default='') | length > 0)
  no_log: true

- name: Resolve local platform facts artifact path for chat fallback
  ansible.builtin.set_fact:
    chat_credential_artifact_file: >-
      {{ chat_credential_artifacts_file | default(playbook_dir ~ '/../../../artifacts/aap_platform_facts.yml', true) }}
  when: chat_app_url is not defined or chat_app_url | string | trim | length == 0

- name: Load chat connection facts from local artifact when credential is not injected
  when: chat_app_url is not defined or chat_app_url | string | trim | length == 0
  block:
    - name: Check platform facts artifact exists for chat fallback
      ansible.builtin.stat:
        path: "{{ chat_credential_artifact_file }}"
      register: chat_credential_artifact_stat

    - name: Load platform facts from artifact for chat fallback
      ansible.builtin.include_vars:
        file: "{{ chat_credential_artifact_file }}"
      when: chat_credential_artifact_stat.stat.exists | default(false)

    - name: Set chat connection facts from local artifact
      ansible.builtin.set_fact:
        chat_app_url: "{{ aap_platform.chat_app.url }}"
        chat_app_username: "{{ aap_platform.chat_app.username }}"
        chat_app_password: "{{ aap_platform.chat_app.password }}"
      when: aap_platform is defined
      no_log: true
