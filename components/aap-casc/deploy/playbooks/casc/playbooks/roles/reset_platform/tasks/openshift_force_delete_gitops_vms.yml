---
- name: Load OpenShift API credentials for Infrastructure VM force delete
  ansible.builtin.include_role:
    name: common
    tasks_from: load_openshift_credential.yml

- name: Terminate stuck Argo CD Application sync operation
  kubernetes.core.k8s_json_patch:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ reset_gitops_app_name }}"
    namespace: "{{ reset_gitops_app_namespace }}"
    patch:
      - op: remove
        path: /operation
  register: reset_gitops_argocd_operation_terminate
  failed_when: false

- name: Refresh Argo CD Application after terminating stuck operation
  kubernetes.core.k8s:
    state: patched
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    kind: Application
    api_version: argoproj.io/v1alpha1
    name: "{{ reset_gitops_app_name }}"
    namespace: "{{ reset_gitops_app_namespace }}"
    definition:
      metadata:
        annotations:
          argocd.argoproj.io/refresh: hard

- name: List VirtualMachineInstances in Infrastructure destination namespace
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    namespace: "{{ reset_gitops_dest_namespace }}"
  register: reset_gitops_vmi_list

- name: Delete VirtualMachineInstances from Infrastructure destination namespace
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    wait: false
  loop: "{{ reset_gitops_vmi_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Clear finalizers on stuck VirtualMachineInstances
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: patched
    merge_type: merge
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    definition:
      metadata:
        finalizers: []
  loop: "{{ reset_gitops_vmi_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: reset_gitops_vmi_finalizer_clear
  failed_when: false

- name: List VirtualMachines in Infrastructure destination namespace
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ reset_gitops_dest_namespace }}"
  register: reset_gitops_vm_list

- name: Delete VirtualMachines from Infrastructure destination namespace
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    wait: false
  loop: "{{ reset_gitops_vm_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Clear finalizers on stuck VirtualMachines
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: patched
    merge_type: merge
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    definition:
      metadata:
        finalizers: []
  loop: "{{ reset_gitops_vm_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: reset_gitops_vm_finalizer_clear
  failed_when: false

- name: Re-delete VirtualMachines after finalizer cleanup
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    wait: false
  loop: "{{ reset_gitops_vm_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: reset_gitops_vm_list.resources | default([]) | length > 0

- name: List Routes in Infrastructure destination namespace
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ reset_gitops_dest_namespace }}"
  register: reset_gitops_route_list

- name: Delete Routes from Infrastructure destination namespace
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: absent
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    wait: false
  loop: "{{ reset_gitops_route_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: List Services in Infrastructure destination namespace
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: v1
    kind: Service
    namespace: "{{ reset_gitops_dest_namespace }}"
  register: reset_gitops_service_list

- name: Delete Apache VM Services from Infrastructure destination namespace
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: absent
    api_version: v1
    kind: Service
    name: "{{ item.metadata.name }}"
    namespace: "{{ reset_gitops_dest_namespace }}"
    wait: false
  loop: "{{ reset_gitops_service_list.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - item.metadata.name != 'kubernetes'
    - >-
      item.metadata.name is match('.*-http$')
      or 'vm.kubevirt.io/name' in (item.spec.selector | default({}))

- name: Summarize forced Infrastructure VM workload deletion
  ansible.builtin.debug:
    msg:
      - "Destination namespace: {{ reset_gitops_dest_namespace }}"
      - "VirtualMachines removed: {{ reset_gitops_vm_list.resources | default([]) | length }}"
      - "VirtualMachineInstances removed: {{ reset_gitops_vmi_list.resources | default([]) | length }}"
      - "Routes removed: {{ reset_gitops_route_list.resources | default([]) | length }}"
      - >-
        Services removed: {{
          reset_gitops_service_list.resources | default([])
          | rejectattr('metadata.name', 'equalto', 'kubernetes')
          | list | length
        }}
