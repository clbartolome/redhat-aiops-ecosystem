---
- name: Load OpenShift API credentials for Apache HTTP probe cleanup
  ansible.builtin.include_role:
    name: common
    tasks_from: load_openshift_credential.yml

- name: List Apache HTTP Probe resources in observability namespace
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: monitoring.coreos.com/v1
    kind: Probe
    namespace: "{{ openshift_apache_monitoring_namespace | default(observability.namespace | default('observability')) }}"
  register: reset_apache_http_probes_observability

- name: List legacy Apache HTTP Probe resources in VM namespace
  kubernetes.core.k8s_info:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    api_version: monitoring.coreos.com/v1
    kind: Probe
    namespace: "{{ reset_gitops_dest_namespace }}"
  register: reset_apache_http_probes_vm_namespace

- name: Build Apache HTTP probes to remove
  ansible.builtin.set_fact:
    reset_apache_http_probes_to_remove: >-
      {{
        (
          reset_apache_http_probes_observability.resources | default([])
          + reset_apache_http_probes_vm_namespace.resources | default([])
        )
        | selectattr('spec.jobName', 'defined')
        | selectattr('spec.jobName', 'equalto', openshift_apache_monitoring_probe_job | default('apache-http'))
        | list
      }}

- name: Remove Apache HTTP Probe resources from OpenShift
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: absent
    api_version: monitoring.coreos.com/v1
    kind: Probe
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
  loop: "{{ reset_apache_http_probes_to_remove | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: reset_apache_http_probes_to_remove | default([]) | length > 0

- name: Re-apply Apache PrometheusRule so stale probe metrics stop firing alerts
  kubernetes.core.k8s:
    host: "{{ openshift_credential_host | default(omit) }}"
    api_key: "{{ openshift_credential_token | default(omit) }}"
    validate_certs: false
    state: present
    definition: "{{ lookup('template', playbook_dir ~ '/templates/openshift_apache_prometheus_rule.yaml.j2') | from_yaml }}"

- name: Purge stale VM fleet metrics from observability Prometheus
  ansible.builtin.include_tasks: observability_purge_vm_fleet_metrics.yml
  when: reset_prometheus_purge_vm_fleet_metrics | default(true) | bool

- name: Resolve OpenShift cluster domain for external Thanos querier URL
  when: lookup('ansible.builtin.env', 'KUBERNETES_SERVICE_HOST', default='') | trim | length == 0
  block:
    - name: Load platform facts for cluster domain when current value is empty
      when: (openshift_cluster_domain | default('') | regex_replace('^apps\.', '') | trim | length) == 0
      block:
        - name: Resolve local platform facts artifact path for cluster domain
          ansible.builtin.set_fact:
            reset_openshift_cluster_domain_artifact_file: >-
              {{ openshift_credential_artifacts_file | default(playbook_dir ~ '/../../../artifacts/aap_platform_facts.yml', true) }}

        - name: Check platform facts artifact exists for cluster domain
          ansible.builtin.stat:
            path: "{{ reset_openshift_cluster_domain_artifact_file }}"
          register: reset_openshift_cluster_domain_artifact_stat

        - name: Load platform facts for cluster domain
          ansible.builtin.include_vars:
            file: "{{ reset_openshift_cluster_domain_artifact_file }}"
          when: reset_openshift_cluster_domain_artifact_stat.stat.exists | default(false)

        - name: Set OpenShift cluster domain from platform facts artifact
          ansible.builtin.set_fact:
            openshift_cluster_domain: "apps.{{ aap_platform.openshift.cluster_domain }}"
          when:
            - aap_platform is defined
            - aap_platform.openshift.cluster_domain | default('') | trim | length > 0

    - name: Derive OpenShift cluster domain from Gitea credential hostname
      ansible.builtin.set_fact:
        openshift_cluster_domain: >-
          {{
            gitea_credential_url
            | regex_replace('^https?://', '')
            | regex_replace('/.*', '')
            | regex_replace('^[^.]+\.', '')
          }}
      when:
        - (openshift_cluster_domain | default('') | regex_replace('^apps\.', '') | trim | length) == 0
        - gitea_credential_url is defined
        - gitea_credential_url | string | trim | length > 0

    - name: Derive OpenShift cluster domain from OpenShift API server hostname
      ansible.builtin.set_fact:
        openshift_cluster_domain: >-
          apps.{{
            (
              openshift_credential_host
              | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST'), true)
              | default('', true)
            )
            | regex_replace('^https?://api\.', '')
            | regex_replace(':.*', '')
          }}
      when:
        - (openshift_cluster_domain | default('') | regex_replace('^apps\.', '') | trim | length) == 0
        - (
            openshift_credential_host | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST'), true) | default('', true)
          ) | trim | length > 0

    - name: Fail when OpenShift cluster domain is not configured
      ansible.builtin.assert:
        that:
          - (openshift_cluster_domain | default('') | regex_replace('^apps\.', '') | trim | length) > 0
        fail_msg: >-
          openshift_cluster_domain is required to query Thanos when not running inside the cluster.
          Ensure artifacts/aap_platform_facts.yml defines aap_platform.openshift.cluster_domain,
          or attach Gitea/OpenShift credentials that expose the cluster apps domain.

- name: Resolve Thanos querier URL for alert clearance check
  ansible.builtin.set_fact:
    reset_thanos_querier_url: >-
      {{
        'https://thanos-querier.openshift-monitoring.svc:9091'
        if (lookup('ansible.builtin.env', 'KUBERNETES_SERVICE_HOST', default='') | trim | length > 0)
        else (
          'https://thanos-querier-openshift-monitoring.apps.'
          ~ openshift_cluster_domain
        ) | replace('.apps.apps.', '.apps.')
      }}

- name: Resolve OpenShift bearer token from AAP injected credential
  ansible.builtin.set_fact:
    reset_openshift_bearer_token: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
  when: lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') | default('') | trim | length > 0
  no_log: true

- name: Resolve OpenShift bearer token from loaded credential facts
  ansible.builtin.set_fact:
    reset_openshift_bearer_token: "{{ openshift_credential_token }}"
  when:
    - reset_openshift_bearer_token is not defined or reset_openshift_bearer_token | string | trim | length == 0
    - openshift_credential_token is defined
    - openshift_credential_token | string | trim | length > 0
  no_log: true

- name: Wait for ApacheApplicationDown alerts to clear after probe removal
  ansible.builtin.uri:
    url: >-
      {{ reset_thanos_querier_url }}/api/v1/query?query={{
      'count(ALERTS{alertname="' ~ openshift_apache_monitoring_alert_name ~ '",alertstate="firing"}) or vector(0)' | urlencode
      }}
    method: GET
    headers:
      Authorization: "Bearer {{ reset_openshift_bearer_token }}"
    validate_certs: false
    status_code: [200]
    return_content: true
  register: reset_apache_firing_alerts_lookup
  until: >-
    (
      reset_apache_firing_alerts_lookup.json.data.result | default([])
      | length == 0
    )
    or (
      reset_apache_firing_alerts_lookup.json.data.result | default([])
      | length > 0
      and (reset_apache_firing_alerts_lookup.json.data.result[0].value[1] | default('1') | int) == 0
    )
  retries: "{{ reset_apache_alert_clear_retries }}"
  delay: "{{ reset_apache_alert_clear_delay }}"

- name: Summarize Apache HTTP probe cleanup
  ansible.builtin.debug:
    msg:
      - >-
        Apache HTTP probes removed: {{
          reset_apache_http_probes_to_remove | default([]) | length
        }}
      - >-
        Firing {{ openshift_apache_monitoring_alert_name }} alerts after cleanup: {{
          (
            reset_apache_firing_alerts_lookup.json.data.result | default([])
            | first
            | default({'value': [0, '0']})
          ).value[1] | default('unknown')
        }}
