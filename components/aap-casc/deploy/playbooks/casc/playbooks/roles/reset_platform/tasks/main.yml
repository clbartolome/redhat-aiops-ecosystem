---
- name: Preflight and load credentials for platform reset
  ansible.builtin.include_tasks: load_credentials.yml
  tags:
    - always

- name: Purge ITSM runtime data
  ansible.builtin.include_tasks: itsm_purge_runtime_data.yml
  tags:
    - itsm

- name: Remove Gitea VM manifests
  ansible.builtin.include_tasks: gitea_cleanup_directory.yml
  vars:
    reset_gitea_cleanup_repo: "{{ reset_gitea_infrastructure_repo }}"
    reset_gitea_cleanup_path: "{{ reset_gitea_infrastructure_path }}"
    reset_gitea_cleanup_patterns: "*.yaml"
    reset_gitea_cleanup_commit_message: Reset demo VM manifests
    reset_gitea_cleanup_workdir: "{{ reset_gitea_workdir }}-infrastructure"
  tags:
    - gitea_vms

- name: Remove Apache HTTP monitoring probes for deleted VMs
  ansible.builtin.include_tasks: openshift_delete_apache_http_probes.yml
  tags:
    - gitea_vms
    - openshift

- name: Force delete Infrastructure VM workloads when Argo CD is stuck
  ansible.builtin.include_tasks: openshift_force_delete_gitops_vms.yml
  tags:
    - openshift
    - argocd

- name: Sync and prune Infrastructure VMs via Argo CD
  block:
    - name: Refresh Infrastructure VMs Argo CD Application
      ansible.builtin.include_role:
        name: gitops_infrastructure
        tasks_from: sync.yml
      vars:
        gitops_infrastructure_sync_wait_retries: "{{ reset_gitops_sync_wait_retries }}"
        gitops_infrastructure_sync_wait_delay: "{{ reset_gitops_sync_wait_delay }}"
        gitops_infrastructure_accept_unhealthy: "{{ reset_gitops_accept_unhealthy | bool }}"
  rescue:
    - name: Continue reset when Argo CD sync does not converge
      ansible.builtin.debug:
        msg: >-
          Argo CD Application {{ reset_gitops_app_name }} did not reach a synced state within
          {{ reset_gitops_sync_wait_retries }} attempts. Infrastructure VM workloads were force-deleted
          directly from OpenShift; review the Argo CD UI if the application remains in error.
  tags:
    - argocd

- name: Restart aiops-tools workload pods after platform reset
  ansible.builtin.include_tasks: openshift_restart_aiops_tools_pods.yml
  tags:
    - openshift
    - aiops_tools

# - name: Clear operations channel chat history
#   ansible.builtin.include_tasks: chat_clear_operations_channel.yml
#   tags:
#     - chat

- name: Run AAP Cleanup Job Details system job
  ansible.builtin.include_tasks: aap_cleanup_job_details.yml
  tags:
    - aap_cleanup

- name: Sync AIOps Infrastructure inventory from ITSM
  ansible.builtin.include_tasks: sync_infrastructure_inventory.yml
  tags:
    - inventory
