---
- name: Publish ITSM notification to chat
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Load chat-app credentials
      ansible.builtin.include_role:
        name: common
        tasks_from: load_chat_credential.yml

    - name: Validate required ITSM chat notification extra vars
      ansible.builtin.assert:
        that:
          - itsm_chat_event is defined
          - itsm_chat_event | string | trim | length > 0
          - chat_incident_title is defined
          - chat_incident_title | string | trim | length > 0
          - chat_incident_message is defined
          - chat_incident_message | string | trim | length > 0
        fail_msg: >-
          itsm_chat_event, chat_incident_title, and chat_incident_message are required.

    - name: Resolve chat incidents API URL
      ansible.builtin.set_fact:
        itsm_chat_incidents_url: >-
          {{
            chat_app_url | default(aap_platform.chat_app.url | default('', true), true)
            | regex_replace('/$', '')
            ~ '/incidents'
          }}

    - name: Fail when chat incidents API URL is unavailable
      ansible.builtin.fail:
        msg: >-
          Chat URL is missing. Attach the Chat App credential to the job template
          or ensure platform facts include chat_app.url.
      when: itsm_chat_incidents_url | default('') | string | trim | length == 0

    - name: Post ITSM notification to chat operations channel
      ansible.builtin.uri:
        url: "{{ itsm_chat_incidents_url }}"
        method: POST
        body_format: json
        body:
          title: "{{ chat_incident_title | string | trim }}"
          message: "{{ chat_incident_message | string | trim }}"
          severity: "{{ chat_incident_severity | default('medium') | string | trim }}"
        validate_certs: false
        status_code: [201]

    - name: Display published ITSM chat notification
      ansible.builtin.debug:
        msg: >-
          [{{ itsm_chat_event | string | trim }}]
          {{ chat_incident_title | string | trim }} —
          {{ chat_incident_message | string | trim }}
          ({{ chat_incident_severity | default('medium') | string | trim }})
