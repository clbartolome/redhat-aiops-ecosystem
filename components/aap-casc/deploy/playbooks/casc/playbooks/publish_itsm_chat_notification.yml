---
- name: Publish ITSM notification to AIOps agent
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Validate required ITSM agent notification extra vars
      ansible.builtin.assert:
        that:
          - itsm_chat_event is defined
          - itsm_chat_event | string | trim | length > 0
          - chat_incident_title is defined
          - chat_incident_title | string | trim | length > 0
          - chat_incident_message is defined
          - chat_incident_message | string | trim | length > 0
        fail_msg: >-
          itsm_chat_event, chat_incident_title, and chat_incident_message are required.

    - name: Resolve agent incidents API URL
      ansible.builtin.set_fact:
        agent_incidents_url: >-
          {{
            agent_incidents_url | default(
              aap_platform.agent.incidents_url | default('', true),
              true
            )
          }}

    - name: Fail when agent incidents API URL is unavailable
      ansible.builtin.fail:
        msg: >-
          Agent incidents URL is missing. Set agent.incidents_url in vars.yaml
          or ensure platform facts include agent.incidents_url.
      when: agent_incidents_url | default('') | string | trim | length == 0

    - name: Post ITSM notification to agent
      ansible.builtin.uri:
        url: "{{ agent_incidents_url }}"
        method: POST
        validate_certs: false
        body_format: json
        body:
          title: "{{ chat_incident_title | string | trim }}"
          message: "{{ chat_incident_message | string | trim }}"
          severity: "{{ chat_incident_severity | default('medium') | string | trim }}"
        status_code: [200, 201, 202, 204]
      register: itsm_agent_notification_post

    - name: Display published ITSM agent notification
      ansible.builtin.debug:
        msg: >-
          [{{ itsm_chat_event | string | trim }}]
          {{ chat_incident_title | string | trim }} —
          {{ chat_incident_message | string | trim }}
          ({{ chat_incident_severity | default('medium') | string | trim }})
