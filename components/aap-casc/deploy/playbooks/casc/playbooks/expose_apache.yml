---
- name: Expose Apache via GitOps Service and Route
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Start ITSM CTASK for Expose Apache
      ansible.builtin.import_role:
        name: itsm_change_task
        tasks_from: start.yml
      vars:
        itsm_ctask_template_name: "{{ itsm_apache_stack_task_template_expose_apache }}"

    - name: Inject Apache Service and Route into VM manifest and sync GitOps
      ansible.builtin.import_role:
        name: apache_exposure

    - name: Complete ITSM CTASK for Expose Apache
      ansible.builtin.import_role:
        name: itsm_change_task
        tasks_from: complete.yml
      vars:
        itsm_ctask_template_name: "{{ itsm_apache_stack_task_template_expose_apache }}"
