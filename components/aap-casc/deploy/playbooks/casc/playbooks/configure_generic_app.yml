---
- name: Resolve target host for Apache stack job
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Resolve target host for Apache stack job
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_apache_app_target_host.yml

- name: Configure application packages, repository, and services on target server
  hosts: apache_app_targets
  gather_facts: false
  become: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Wait for SSH connectivity to provisioned VM
      ansible.builtin.include_role:
        name: common
        tasks_from: wait_for_vm_ssh.yml

    - name: Gather facts from target host
      ansible.builtin.setup:

    - name: Install application packages on target host
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: install

    - name: Deploy application repository into Apache docroot
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: deploy

    - name: Enable and start application services
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: start
