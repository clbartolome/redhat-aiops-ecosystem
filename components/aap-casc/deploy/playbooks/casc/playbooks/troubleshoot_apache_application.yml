---
- name: Troubleshoot Apache application (preflight)
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Load ITSM API credentials
      ansible.builtin.include_role:
        name: common
        tasks_from: load_itsm_credential.yml

    - name: Load chat-app credentials
      ansible.builtin.include_role:
        name: common
        tasks_from: load_chat_credential.yml

    - name: Validate required ITSM incident reference
      ansible.builtin.assert:
        that:
          - itsm_incident_ref is defined
          - itsm_incident_ref | string | trim | length > 0
        fail_msg: >-
          itsm_incident_ref is required. Launch via AAP MCP after user confirms
          remediation in chat.

    - name: Resolve vm_name from ITSM incident when not provided
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_vm_name_from_incident.yml

    - name: Load Generic Application asset fields from ITSM
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_apache_app_asset_from_itsm.yml

    - name: Initialize troubleshooting summary facts
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines:
          - >-
            Troubleshooting Apache on {{ vm_name | string | trim }}
            (incident {{ itsm_incident_ref | string | trim }}) using ITSM asset
            {{ apache_troubleshoot_app_asset.name | default('unknown') }}.

    - name: Ensure GitOps VM and Apache exposure exist before SSH remediation
      ansible.builtin.include_role:
        name: common
        tasks_from: ensure_apache_gitops_stack.yml

    - name: Refresh VM SSH target, ITSM asset connectivity, and AAP inventory
      ansible.builtin.include_role:
        name: common
        tasks_from: refresh_vm_ssh_target.yml

    - name: Resolve target host for Apache troubleshooting
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_apache_app_target_host.yml

- name: Verify and remediate Apache application stack on target VM
  hosts: apache_app_targets
  gather_facts: true
  become: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Verify SSH connectivity to target VM
      ansible.builtin.ping:
      register: apache_troubleshoot_ssh_ping
      until: apache_troubleshoot_ssh_ping is succeeded
      retries: 18
      delay: 10

    - name: Load effective Apache application configuration from ITSM asset
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: load_troubleshoot_effective_config

    - name: Verify RPM packages from ITSM asset are installed
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: verify_packages

    - name: Record RPM verification in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + [
              'All required RPM packages installed (' ~ (apache_app_rpm_package_list | join(', ')) ~ ').'
              if (apache_app_packages_missing | default([]) | length) == 0
              else 'Missing RPM packages: ' ~ (apache_app_packages_missing | join(', ')) ~ '.'
            ]
          }}
      delegate_to: localhost
      delegate_facts: true

    - name: Install missing RPM packages from ITSM asset
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: install
      when: apache_app_packages_missing | default([]) | length > 0

    - name: Record RPM installation remediation in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + ['Installed missing RPM packages: ' ~ (apache_app_packages_missing | join(', ')) ~ '.']
          }}
      delegate_to: localhost
      delegate_facts: true
      when: apache_app_packages_missing | default([]) | length > 0

    - name: Verify application repository is deployed at docroot
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: verify_deploy

    - name: Record deploy verification in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + [
              'Application repository present at ' ~ apache_troubleshoot_runtime_apache_app_docroot ~ '.'
              if not (apache_app_deploy_missing | default(true) | bool)
              else 'Application repository missing or invalid at ' ~ apache_troubleshoot_runtime_apache_app_docroot ~ '.'
            ]
          }}
      delegate_to: localhost
      delegate_facts: true

    - name: Deploy application repository when docroot is missing
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: deploy
      when: apache_app_deploy_missing | default(true) | bool

    - name: Record deploy remediation in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + ['Redeployed application repository ' ~ apache_troubleshoot_runtime_app_repo ~ ' to ' ~ apache_troubleshoot_runtime_apache_app_docroot ~ '.']
          }}
      delegate_to: localhost
      delegate_facts: true
      when: apache_app_deploy_missing | default(true) | bool

    - name: Verify enabled services from ITSM asset are running
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: verify_services

    - name: Record service verification in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + [
              'All enabled services active (' ~ (apache_app_enabled_service_list | join(', ')) ~ ').'
              if (apache_app_services_down | default([]) | length) == 0
              else 'Services down or missing packages: ' ~ (apache_app_services_down | join(', ')) ~ '.'
            ]
          }}
      delegate_to: localhost
      delegate_facts: true

    - name: Start enabled services when down
      ansible.builtin.include_role:
        name: apache_app
        tasks_from: start
      when: apache_app_services_down | default([]) | length > 0

    - name: Record service start remediation in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + ['Started services: ' ~ (apache_app_services_down | join(', ')) ~ '.']
          }}
      delegate_to: localhost
      delegate_facts: true
      when: apache_app_services_down | default([]) | length > 0

    - name: Verify Apache responds on localhost service port
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{
            apache_troubleshoot_runtime_apache_exposure_service_port | default('80') | string | trim
          }}/
        status_code: [200, 403, 301, 302]
      register: apache_troubleshoot_local_http
      until: apache_troubleshoot_local_http.status in [200, 403, 301, 302]
      retries: 12
      delay: 5

    - name: Record local HTTP verification in summary
      ansible.builtin.set_fact:
        apache_troubleshoot_summary_lines: >-
          {{
            hostvars['localhost'].apache_troubleshoot_summary_lines
            + [
              'Local HTTP check on port '
              ~ (apache_troubleshoot_runtime_apache_exposure_service_port | default('80') | string | trim)
              ~ ' returned status '
              ~ (apache_troubleshoot_local_http.status | string)
              ~ '.'
            ]
          }}
      delegate_to: localhost
      delegate_facts: true

- name: Complete ITSM incident and notify chat
  hosts: localhost
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Build final remediation summary text
      ansible.builtin.set_fact:
        apache_troubleshoot_summary: "{{ apache_troubleshoot_summary_lines | join(' ') }}"

    - name: POST remediation comment on ITSM incident
      ansible.builtin.uri:
        url: >-
          {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/incidents/{{
          itsm_incident_ref | string | trim | urlencode }}/comments
        method: POST
        force_basic_auth: true
        url_username: "{{ itsm_api_user }}"
        url_password: "{{ itsm_api_password }}"
        validate_certs: "{{ itsm_validate_certs | default(false) }}"
        body_format: json
        body:
          body: "{{ apache_troubleshoot_summary }}"
        status_code: [200]
        headers:
          Accept: application/json
          Content-Type: application/json

    - name: Close ITSM incident after successful remediation
      ansible.builtin.uri:
        url: >-
          {{ itsm_api_base_url | regex_replace('/$', '') }}/api/v1/incidents/{{
          itsm_incident_ref | string | trim | urlencode }}/close
        method: POST
        force_basic_auth: true
        url_username: "{{ itsm_api_user }}"
        url_password: "{{ itsm_api_password }}"
        validate_certs: "{{ itsm_validate_certs | default(false) }}"
        body_format: json
        body: {}
        status_code: [200]
        headers:
          Accept: application/json
          Content-Type: application/json

    - name: Post remediation summary to chat agent thread
      ansible.builtin.include_role:
        name: common
        tasks_from: post_chat_thread_info.yml
      vars:
        chat_thread_info_message: >-
          [remediation.complete] {{ itsm_incident_ref | string | trim }} on
          {{ vm_name | string | trim }} — {{ apache_troubleshoot_summary }}
      when:
        - apache_troubleshoot_post_chat_summary | default(true) | bool
        - (thread_id | default(chat_thread_id | default(''), true)) | string | trim | length > 0

    - name: Skip chat notification when agent thread id is unavailable
      ansible.builtin.debug:
        msg: >-
          thread_id is missing; skipping remediation summary post to chat.
          Launch via AAP MCP from the chat agent thread so thread_id is injected.
          Set apache_troubleshoot_post_chat_summary: false to silence this notice.
      when:
        - apache_troubleshoot_post_chat_summary | default(true) | bool
        - (thread_id | default(chat_thread_id | default(''), true)) | string | trim | length == 0

    - name: Skip chat notification when remediation chat posts are disabled
      ansible.builtin.debug:
        msg: Remediation chat summary posting is disabled (apache_troubleshoot_post_chat_summary=false).
      when: not (apache_troubleshoot_post_chat_summary | default(true) | bool)

    - name: Display troubleshooting result
      ansible.builtin.debug:
        msg: "{{ apache_troubleshoot_summary }}"
