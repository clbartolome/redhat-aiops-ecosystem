---
# With ansible-navigator, run the deploy/ wrapper so roles and group_vars mount in the EE:
#   ansible-navigator run ../components/aap-casc/deploy/run-sync-playbooks.yml
- name: Sync AIOps Playbooks to Gitea and refresh AAP project
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../group_vars/all/gitea_repos.yml
    - ../../group_vars/all/aap_vm_pipeline.yml
    - ../../group_vars/all/aap_casc.yml
  vars:
    gitea_use_cluster_secrets: true
    gitea_repos_local_base: "{{ playbook_dir }}"
    gitea_repos_sync_only:
      - Playbooks
  tasks:
    - name: Setup kubeconfig from OpenShift extra vars
      ansible.builtin.include_role:
        name: demos.utils.kubeconfig
      vars:
        kubeconfig:
          ocp_domain: "{{ ocp_host }}"
          ocp_api_token: "{{ api_token }}"
      when: ocp_host is defined and api_token is defined

    - name: Resolve kubeconfig path for OpenShift API access
      ansible.builtin.set_fact:
        sync_playbooks_kubeconfig_path: >-
          {{
            lookup('ansible.builtin.env', 'KUBECONFIG')
            | default(lookup('ansible.builtin.env', 'HOME') ~ '/.kube/config', true)
          }}

    - name: Check OpenShift kubeconfig file exists
      ansible.builtin.stat:
        path: "{{ sync_playbooks_kubeconfig_path }}"
      register: sync_playbooks_kubeconfig_stat
      when: ocp_host is not defined or api_token is not defined

    - name: Verify OpenShift API access is configured
      ansible.builtin.assert:
        that:
          - (ocp_host is defined and api_token is defined)
            or (sync_playbooks_kubeconfig_stat.stat.exists | default(false))
        fail_msg: >-
          OpenShift API access is required. Run `oc login` before sync-playbooks,
          or pass -e ocp_host=<cluster-domain> -e api_token=<openshift-token>.

    - name: Discover AAP controller connection facts from OpenShift
      ansible.builtin.include_role:
        name: aap-controller-facts

    - name: Push Playbooks repository to Gitea from local source
      ansible.builtin.include_role:
        name: gitea-repos

    - name: Obtain AAP gateway OAuth token for project sync
      ansible.builtin.include_role:
        name: aap-controller
      vars:
        aap_controller_token_fact_name: aap_vm_pipeline_controller_oauthtoken

    - name: Run AAP VM pipeline preflight checks
      ansible.builtin.include_role:
        name: aap-vm-pipeline
        tasks_from: preflight.yml

    - name: Refresh AIOps Playbooks project from Gitea SCM
      environment:
        CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_vm_pipeline_controller_api_prefix }}"
      block:
        - name: Update AIOps Playbooks project from SCM
          ansible.builtin.include_role:
            name: aap-vm-pipeline
            tasks_from: project.yml
