---
- name: Run AAP httpd pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for API calls
  ansible.builtin.include_role:
    name: aap-controller
  vars:
    aap_controller_token_fact_name: aap_httpd_pipeline_controller_oauthtoken

- name: Configure AAP job templates for Generic Application stack nodes
  block:
    - name: Remove legacy httpd pipeline job templates and workflows from AAP
      ansible.builtin.include_tasks: remove_legacy.yml

    - name: Ensure Generic Application stack job templates exist
      ansible.builtin.include_tasks: job_templates.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_httpd_pipeline_controller_api_prefix }}"

- name: Display AAP httpd pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_httpd_pipeline_organization }}"
      - "Project: {{ aap_httpd_pipeline_project }}"
      - "Inventory: {{ aap_httpd_pipeline_inventory }} (ITSM Assets SCM source; populated after VM registration)"
      - >-
        Job templates: {{ aap_httpd_pipeline_jt_configure }}, {{ aap_httpd_pipeline_jt_expose }},
        {{ aap_httpd_pipeline_jt_register_itsm }}, {{ aap_httpd_pipeline_jt_complete_stack }}
