---
- name: Load Gitea connection facts from OpenShift cluster secrets
  ansible.builtin.include_role:
    name: gitea-cluster-facts
  when: gitea_use_cluster_secrets | default(false) | bool

- name: Map Gitea API connection from platform facts
  ansible.builtin.set_fact:
    gitea_api_base: "{{ aap_platform.gitea.url }}"
    gitea_admin_username: "{{ aap_platform.gitea.username }}"
    gitea_admin_password: "{{ aap_platform.gitea.password }}"
  when:
    - aap_platform is defined
    - gitea_api_base is not defined
  no_log: true

- name: Fail when Gitea connection facts are not available
  ansible.builtin.fail:
    msg: >-
      Gitea connection facts are missing. Run aap-platform-facts before gitea-repos,
      or set gitea_use_cluster_secrets: true to load credentials from the Gitea
      OpenShift secrets.
  when:
    - gitea_api_base is not defined or gitea_admin_username is not defined or gitea_admin_password is not defined

- name: Run Gitea repository preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Resolve Gitea repository sync sources
  ansible.builtin.set_fact:
    gitea_repos_seeds: "{{ gitea_repos_seeds | default([]) + [gitea_repos_seed_entry] }}"
  loop: "{{ gitea_repos_sync_repo_defs }}"
  loop_control:
    loop_var: repo
    label: "{{ repo.name }}"
  when:
    - not (repo.skip_sync | default(false) | bool)
    - gitea_repos_sync_only | default([]) | length == 0 or repo.name in gitea_repos_sync_only
  vars:
    gitea_repos_seed_entry: >-
      {{
        {'name': repo.name, 'source_path': gitea_repos_local_base ~ '/' ~ repo.local_dir}
        | combine(
            {'preserve_paths': repo.preserve_paths}
            if repo.preserve_paths is defined else {}
          )
        if repo.local_dir is defined
        else {
          'name': repo.name,
          'source_url': repo.source_url,
          'branch': repo.branch | default(gitea_repos_default_branch)
        }
      }}

- name: Create Gitea repositories
  ansible.builtin.include_tasks: repositories.yml

- name: Sync Gitea repositories from configured sources
  ansible.builtin.include_tasks: sync_repositories.yml
  when: gitea_repos_seeds | default([]) | length > 0

- name: Display Gitea repository configuration summary
  ansible.builtin.debug:
    msg:
      - "Gitea URL: {{ gitea_api_base }}"
      - "Repository owner: {{ gitea_owner }}"
      - "Repositories: {{ gitea_repos_list | join(', ') }}"
      - >-
        Synced from source: {{
          gitea_repos_synced_names | default([]) | join(', ')
          if (gitea_repos_synced_names | default([]) | length > 0)
          else 'none'
        }}
      - "Clone URLs:"
      - "{{ gitea_repos_clone_urls }}"
