---
- name: Fail when platform facts are not loaded
  ansible.builtin.fail:
    msg: Run aap-platform-facts before this pipeline.
  when: aap_platform is not defined

- name: Set AAP controller connection facts from platform facts
  ansible.builtin.set_fact:
    aap_apache_troubleshoot_pipeline_controller_host: "{{ aap_platform.aap.gateway_url }}"
    aap_apache_troubleshoot_pipeline_controller_username: "{{ aap_platform.aap.username }}"
    aap_apache_troubleshoot_pipeline_controller_password: "{{ aap_platform.aap.password }}"
  no_log: true

- name: Verify AAP Controller API responds
  ansible.builtin.uri:
    url: "{{ aap_apache_troubleshoot_pipeline_controller_host }}/api/controller/v2/ping/"
    method: GET
    user: "{{ aap_apache_troubleshoot_pipeline_controller_username }}"
    password: "{{ aap_apache_troubleshoot_pipeline_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_apache_troubleshoot_pipeline_validate_certs }}"
    status_code: 200
  no_log: true

