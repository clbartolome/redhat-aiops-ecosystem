---
- name: Run AAP VM pipeline preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Obtain AAP gateway OAuth token for API calls
  ansible.builtin.include_role:
    name: aap-controller
  vars:
    aap_controller_token_fact_name: aap_vm_pipeline_controller_oauthtoken

- name: Configure AAP inventory, project, and VM stack job templates
  block:
    - name: Ensure AIOps localhost inventory exists
      ansible.builtin.include_tasks: inventory.yml

    - name: Ensure Gitea Source Control credential exists in AAP
      ansible.builtin.include_tasks: scm_credential.yml

    - name: Ensure AIOps Playbooks project exists
      ansible.builtin.include_tasks: project.yml

    - name: Ensure AIOps Infrastructure inventory and ITSM inventory source exist
      ansible.builtin.include_tasks: infrastructure_inventory.yml

    - name: Remove legacy VM pipeline job templates and workflows from AAP
      ansible.builtin.include_tasks: remove_legacy.yml

    - name: Ensure VM stack job templates exist
      ansible.builtin.include_tasks: job_templates.yml
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "{{ aap_vm_pipeline_controller_api_prefix }}"

- name: Display AAP VM pipeline summary
  ansible.builtin.debug:
    msg:
      - "Organization: {{ aap_vm_pipeline_organization }}"
      - "Project: {{ aap_vm_pipeline_project }}"
      - "Job templates: {{ aap_vm_pipeline_jt_provision_vm }}, {{ aap_vm_pipeline_jt_register_itsm }}"
      - "Inventories: {{ aap_vm_pipeline_inventory }}, {{ aap_vm_pipeline_infrastructure_inventory }}"
