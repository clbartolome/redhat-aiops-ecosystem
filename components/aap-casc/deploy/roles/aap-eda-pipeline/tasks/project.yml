---
- name: Ensure AIOps Rulebooks EDA project exists
  ansible.eda.project:
    name: "{{ aap_eda_pipeline_project }}"
    description: Event-Driven Ansible rulebooks for AIOps demo
    organization_name: "{{ aap_eda_pipeline_organization }}"
    url: "{{ aap_eda_pipeline_gitea_scm_url }}"
    scm_branch: "{{ aap_eda_pipeline_scm_branch }}"
    credential: "{{ aap_eda_pipeline_gitea_credential }}"
    sync: false
    wait: true
    state: present
    controller_host: "{{ aap_eda_pipeline_controller_host }}"
    controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
    validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
  register: aap_eda_pipeline_project_result

- name: Fail when EDA Rulebooks project was not created
  ansible.builtin.fail:
    msg: >-
      EDA project '{{ aap_eda_pipeline_project }}' was not created.
      Ensure Gitea Rulebooks repo contains a rulebooks/ directory
      (run configure_gitea_repos.yml).
  when: aap_eda_pipeline_project_result.id is not defined

- name: Sync AIOps Rulebooks EDA project
  ansible.builtin.include_tasks: sync_project.yml
  vars:
    eda_project_sync_name: "{{ aap_eda_pipeline_project }}"
    eda_project_sync_organization: "{{ aap_eda_pipeline_organization }}"
    eda_project_sync_controller_host: "{{ aap_eda_pipeline_controller_host }}"
    eda_project_sync_controller_token: "{{ aap_eda_pipeline_controller_oauthtoken }}"
    eda_project_sync_validate_certs: "{{ aap_eda_pipeline_validate_certs }}"
