---
- name: Check OpenShift MCP server deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: openshift-mcp-server
    namespace: "{{ openshift_mcp.namespace }}"
  register: openshift_mcp_existing_deployment
  failed_when: false

- name: Set OpenShift MCP install skip fact
  ansible.builtin.set_fact:
    openshift_mcp_install_skip: >-
      {{
        (openshift_mcp_existing_deployment.resources | default([]) | length > 0)
        and (openshift_mcp_existing_deployment.resources[0].status.availableReplicas | default(0) | int > 0)
      }}

- name: Install OpenShift MCP server when not already present
  when: not openshift_mcp_install_skip | bool
  block:
    - name: Create OpenShift MCP project
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            name: "{{ openshift_mcp.namespace }}"

    - name: Add OpenShift Helm charts repository
      kubernetes.core.helm_repository:
        name: openshift-helm-charts
        repo_url: https://charts.openshift.io/
      register: openshift_mcp_helm_repo_result
      failed_when: >-
        openshift_mcp_helm_repo_result is failed
        and 'already have a repository' not in (openshift_mcp_helm_repo_result.msg | default(''))

    - name: Install OpenShift MCP server
      kubernetes.core.helm:
        name: openshift-mcp-server
        chart_ref: openshift-helm-charts/redhat-openshift-mcp-server
        release_namespace: "{{ openshift_mcp.namespace }}"
        release_state: present
        update_repo_cache: true
        values: "{{ lookup('file', playbook_dir ~ '/components/openshift-mcp/values.yaml') | from_yaml }}"
        wait: true

- name: Skip OpenShift MCP install when server is already running
  ansible.builtin.debug:
    msg: >-
      OpenShift MCP server is already running in namespace {{ openshift_mcp.namespace }}.
      Skipping Helm install.
  when: openshift_mcp_install_skip | bool
