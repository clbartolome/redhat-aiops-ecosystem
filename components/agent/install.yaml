---
- name: Create agent project
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: project.openshift.io/v1
      kind: Project
      metadata:
        name: "{{ agent.namespace }}"

- name: Build agent-config from templated env
  ansible.builtin.set_fact:
    agent_config: "{{ agent_config | default({}) | combine({ (item.split('=', 1)[0]): (item.split('=', 1)[1] | string) }) }}"
  loop: "{{ lookup('template', playbook_dir ~ '/components/agent/.env').splitlines() | select('match', '^[A-Za-z_][A-Za-z0-9_]*=') | list }}"

- name: Create agent-config secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: agent-config
        namespace: "{{ agent.namespace }}"
      type: Opaque
      stringData: "{{ agent_config }}"

- name: Apply agent manifests
  kubernetes.core.k8s:
    state: present
    namespace: "{{ agent.namespace }}"
    definition: "{{ lookup('template', item) | from_yaml }}"
    wait: true
    wait_timeout: 180
  loop: "{{ query('fileglob', playbook_dir ~ '/components/agent/crds/*.yaml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
