---
- name: Delete agent manifests
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ agent.namespace }}"
    definition: "{{ lookup('template', item) | from_yaml }}"
    wait: true
  loop: "{{ query('fileglob', playbook_dir ~ '/components/agent/crds/*.yaml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Delete agent-config secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: agent-config
    namespace: "{{ agent.namespace }}"

- name: Delete agent project
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: project.openshift.io/v1
      kind: Project
      metadata:
        name: "{{ agent.namespace }}"
  ignore_errors: true
