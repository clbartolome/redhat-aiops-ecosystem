---
- name: Delete chat manifests
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ chat.namespace }}"
    definition: "{{ lookup('template', item) | from_yaml }}"
    wait: true
  loop: "{{ query('fileglob', playbook_dir ~ '/components/chat/crds/*.yaml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Delete chat-config secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: chat-config
    namespace: "{{ chat.namespace }}"

- name: Delete chat project
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: project.openshift.io/v1
      kind: Project
      metadata:
        name: "{{ chat.namespace }}"
  when: chat.namespace != agent.namespace
  ignore_errors: true
