---
- name: Get itsm-app pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ itsm.namespace }}"
    label_selectors:
      - app=itsm-app
  register: itsm_standard_password_pods

- name: Fail when itsm-app pod is missing
  ansible.builtin.fail:
    msg: No itsm-app pod found in namespace {{ itsm.namespace }}.
  when: itsm_standard_password_pods.resources | length == 0

- name: Wait for itsm-app pod to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: "{{ itsm_standard_password_pods.resources[0].metadata.name }}"
    namespace: "{{ itsm.namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 180

- name: Ensure ITSM admin and aiops passwords match configured values
  kubernetes.core.k8s_exec:
    namespace: "{{ itsm.namespace }}"
    pod: "{{ itsm_standard_password_pods.resources[0].metadata.name }}"
    container: itsm-app
    command: >-
      /bin/sh -c
      'ITSM_SYNC_ADMIN_USER={{ itsm.bootstrap_admin_user | quote }}
      ITSM_SYNC_ADMIN_PASSWORD={{ itsm.bootstrap_admin_password | quote }}
      ITSM_SYNC_AIOPS_PASSWORD={{ itsm.seed_aiops_password | quote }}
      exec python3 /opt/itsm-entrypoint/sync_passwords.py'
  register: itsm_standard_password_sync
  changed_when: "'updated ' in (itsm_standard_password_sync.stdout | default(''))"
  retries: 5
  delay: 10
  until: itsm_standard_password_sync is not failed
  no_log: true
