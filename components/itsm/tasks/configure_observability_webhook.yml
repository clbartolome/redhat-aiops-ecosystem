---
- name: Set ITSM observability webhook URL fact
  ansible.builtin.set_fact:
    itsm_observability_webhook_url: >-
      http://otel-collector-upstream.{{ observability.namespace }}.svc:8091/v1/itsm

- name: Get ITSM app pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ itsm.namespace }}"
    label_selectors:
      - app=itsm-app
  register: itsm_observability_pods

- name: Fail when ITSM app pod is missing
  ansible.builtin.fail:
    msg: No itsm-app pod found in namespace {{ itsm.namespace }}.
  when: itsm_observability_pods.resources | length == 0

- name: Wait for itsm-app pod to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: "{{ itsm_observability_pods.resources[0].metadata.name }}"
    namespace: "{{ itsm.namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 180

- name: List configured ITSM outbound webhooks
  kubernetes.core.k8s_exec:
    namespace: "{{ itsm.namespace }}"
    pod: "{{ itsm_observability_pods.resources[0].metadata.name }}"
    container: itsm-app
    command: >-
      /bin/sh -c
      'ITSM_SYNC_ADMIN_USER={{ itsm.bootstrap_admin_user | quote }}
      ITSM_SYNC_ADMIN_PASSWORD={{ itsm.bootstrap_admin_password | quote }}
      exec python3 /opt/itsm-entrypoint/observability_webhook.py list'
  register: itsm_observability_webhook_lookup_raw
  changed_when: false
  retries: 5
  delay: 10
  until: itsm_observability_webhook_lookup_raw is not failed
  no_log: true

- name: Parse ITSM outbound webhook lookup result
  ansible.builtin.set_fact:
    itsm_observability_webhook_lookup:
      json: "{{ itsm_observability_webhook_lookup_raw.stdout | from_json }}"

- name: Create ITSM outbound webhook for observability pipeline
  kubernetes.core.k8s_exec:
    namespace: "{{ itsm.namespace }}"
    pod: "{{ itsm_observability_pods.resources[0].metadata.name }}"
    container: itsm-app
    command: >-
      /bin/sh -c
      'ITSM_SYNC_ADMIN_USER={{ itsm.bootstrap_admin_user | quote }}
      ITSM_SYNC_ADMIN_PASSWORD={{ itsm.bootstrap_admin_password | quote }}
      ITSM_OBSERVABILITY_WEBHOOK_URL={{ itsm_observability_webhook_url | quote }}
      exec python3 /opt/itsm-entrypoint/observability_webhook.py ensure'
  when: >-
    itsm_observability_webhook_lookup.json
    | selectattr('url', 'equalto', itsm_observability_webhook_url)
    | list
    | length == 0
  no_log: true
