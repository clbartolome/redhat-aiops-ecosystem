---
- name: Set ITSM observability webhook URL fact
  ansible.builtin.set_fact:
    itsm_observability_webhook_url: >-
      http://otel-collector-upstream.{{ observability.namespace }}.svc:8091/v1/itsm

- name: Get ITSM app pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ itsm.namespace }}"
    label_selectors:
      - app=itsm-app
  register: itsm_observability_pods

- name: Fail when ITSM app pod is missing
  ansible.builtin.fail:
    msg: No itsm-app pod found in namespace {{ itsm.namespace }}.
  when: itsm_observability_pods.resources | length == 0

- name: List configured ITSM outbound webhooks
  kubernetes.core.k8s_exec:
    namespace: "{{ itsm.namespace }}"
    pod: "{{ itsm_observability_pods.resources[0].metadata.name }}"
    container: itsm-app
    command: >-
      python3 -c {{ itsm_observability_list_webhooks_script | quote }}
  vars:
    itsm_observability_list_webhooks_script: >-
      import json, urllib.request, base64;
      auth = base64.b64encode({{ (itsm.bootstrap_admin_user ~ ':' ~ itsm.bootstrap_admin_password) | to_json }}.encode()).decode();
      req = urllib.request.Request(
        "http://127.0.0.1:8000/api/v1/settings/webhooks",
        headers={"Authorization": "Basic " + auth},
      );
      print(urllib.request.urlopen(req).read().decode())
  register: itsm_observability_webhook_lookup_raw
  changed_when: false
  no_log: true

- name: Parse ITSM outbound webhook lookup result
  ansible.builtin.set_fact:
    itsm_observability_webhook_lookup:
      json: "{{ itsm_observability_webhook_lookup_raw.stdout | from_json }}"

- name: Create ITSM outbound webhook for observability pipeline
  kubernetes.core.k8s_exec:
    namespace: "{{ itsm.namespace }}"
    pod: "{{ itsm_observability_pods.resources[0].metadata.name }}"
    container: itsm-app
    command: >-
      python3 -c {{ itsm_observability_create_webhook_script | quote }}
  vars:
    itsm_observability_create_webhook_script: >-
      import json, urllib.request, base64;
      auth = base64.b64encode({{ (itsm.bootstrap_admin_user ~ ':' ~ itsm.bootstrap_admin_password) | to_json }}.encode()).decode();
      body = json.dumps({{ {'url': itsm_observability_webhook_url, 'label': 'AIOps observability', 'enabled': True} }}).encode();
      req = urllib.request.Request(
        "http://127.0.0.1:8000/api/v1/settings/webhooks",
        data=body,
        method="POST",
        headers={"Authorization": "Basic " + auth, "Content-Type": "application/json"},
      );
      print(urllib.request.urlopen(req).read().decode())
  when: >-
    itsm_observability_webhook_lookup.json
    | selectattr('url', 'equalto', itsm_observability_webhook_url)
    | list
    | length == 0
  no_log: true
