---
- name: Create monitor project
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: project.openshift.io/v1
      kind: Project
      metadata:
        name: "{{ monitor.namespace }}"

- name: Build monitor-config from templated env
  ansible.builtin.set_fact:
    monitor_config: "{{ monitor_config | default({}) | combine({ (item.split('=', 1)[0]): (item.split('=', 1)[1] | string) }) }}"
  loop: "{{ lookup('template', playbook_dir ~ '/components/monitor/.env').splitlines() | select('match', '^[A-Za-z_][A-Za-z0-9_]*=') | list }}"

- name: Create monitor-config secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: monitor-config
        namespace: "{{ monitor.namespace }}"
      type: Opaque
      stringData: "{{ monitor_config }}"

- name: Apply monitor manifests
  kubernetes.core.k8s:
    state: present
    namespace: "{{ monitor.namespace }}"
    definition: "{{ lookup('template', item) | from_yaml }}"
    wait: true
    wait_timeout: 180
  loop: "{{ query('fileglob', playbook_dir ~ '/components/monitor/crds/*.yaml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
