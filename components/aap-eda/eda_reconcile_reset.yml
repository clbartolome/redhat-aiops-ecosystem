---
- name: Temporarily disable EDA to reset operator reconciliation
  kubernetes.core.k8s:
    state: present
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ aap_eda.instance_name }}"
    namespace: "{{ aap_eda.namespace }}"
    merge_type: merge
    definition:
      spec:
        eda:
          disabled: true

- name: Remove lingering EDA custom resource during reconcile reset
  kubernetes.core.k8s:
    state: absent
    api_version: eda.ansible.com/v1alpha1
    kind: EDA
    name: "{{ aap_eda_cr_name }}"
    namespace: "{{ aap_eda.namespace }}"
    wait: true
    wait_timeout: 300
  failed_when: false

- name: Wait for AAP EDA Deployments removal during reconcile reset
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_reset_deployment_wait
  until: aap_eda_reset_deployment_wait.resources | default([]) | length == 0
  retries: 18
  delay: 10
  failed_when: false
  loop: "{{ aap_eda_deployment_names }}"
  loop_control:
    label: "{{ item }}"

- name: Remove remaining AAP EDA Deployments during reconcile reset
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.item }}"
    namespace: "{{ aap_eda.namespace }}"
    wait: true
    wait_timeout: 120
  loop: "{{ aap_eda_reset_deployment_wait.results | default([]) }}"
  when: item.resources | default([]) | length > 0
  loop_control:
    label: "{{ item.item | default('unknown') }}"

- name: Re-enable EDA on Ansible Automation Platform instance
  kubernetes.core.k8s:
    state: present
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ aap_eda.instance_name }}"
    namespace: "{{ aap_eda.namespace }}"
    merge_type: merge
    definition: "{{ lookup('template', playbook_dir ~ '/components/aap-eda/eda-spec.yaml.j2') | from_yaml }}"

- name: Wait for EDA custom resource after reconcile reset
  kubernetes.core.k8s_info:
    api_version: eda.ansible.com/v1alpha1
    kind: EDA
    name: "{{ aap_eda_cr_name }}"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_cr_info
  until: aap_eda_cr_info.resources | default([]) | length > 0
  retries: "{{ aap_eda_cr_wait_retries | default(60) }}"
  delay: "{{ aap_eda_cr_wait_delay | default(10) }}"
  failed_when: false

- name: Set EDA custom resource presence after reconcile reset
  ansible.builtin.set_fact:
    aap_eda_cr_present: "{{ aap_eda_cr_info.resources | default([]) | length > 0 }}"
