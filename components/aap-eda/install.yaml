---
- name: Check Ansible Automation Platform instance exists
  kubernetes.core.k8s_info:
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ aap_eda.instance_name }}"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_instance

- name: Fail when Ansible Automation Platform instance is missing
  ansible.builtin.fail:
    msg: >-
      AnsibleAutomationPlatform/{{ aap_eda.instance_name }} not found in
      namespace {{ aap_eda.namespace }}. Deploy AAP before installing aap-eda.
  when: aap_instance.resources | length == 0

- name: Check Event-Driven Ansible CRD is installed
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: edas.eda.ansible.com
  register: aap_eda_crd

- name: Fail when Event-Driven Ansible CRD is not installed
  ansible.builtin.fail:
    msg: >-
      CRD edas.eda.ansible.com is not installed. Install the AAP operator with
      Event-Driven Ansible support before running aap-eda install.
  when: aap_eda_crd.resources | length == 0

- name: Check for existing Event-Driven Ansible custom resources
  kubernetes.core.k8s_info:
    api_version: eda.ansible.com/v1alpha1
    kind: EDA
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_existing_cr_list

- name: Check ansible-eda-api Deployment when EDA CR exists
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ aap_eda.instance_name }}-eda-api"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_existing_api_deployment
  when: aap_eda_existing_cr_list.resources | length > 0

- name: Set AAP EDA install skip fact when EDA API is available
  ansible.builtin.set_fact:
    aap_eda_install_skip: true
    aap_eda_cr_name: "{{ aap_eda_existing_cr_list.resources[0].metadata.name }}"
  when:
    - aap_eda_existing_cr_list.resources | length > 0
    - aap_eda_existing_api_deployment is defined
    - aap_eda_existing_api_deployment.resources | default([]) | length > 0
    - aap_eda_existing_api_deployment.resources[0].status.availableReplicas | default(0) | int > 0

- name: Set AAP EDA install skip fact when EDA is not ready
  ansible.builtin.set_fact:
    aap_eda_install_skip: false
  when: aap_eda_install_skip is not defined

- name: Install and reconcile AAP Event-Driven Ansible when not already running
  when: not aap_eda_install_skip | bool
  ansible.builtin.include_tasks: "{{ playbook_dir }}/components/aap-eda/install-reconcile.yml"

- name: Skip AAP EDA install when platform is already running
  ansible.builtin.debug:
    msg: >-
      Event-Driven Ansible is already running in namespace {{ aap_eda.namespace }}
      (EDA/{{ aap_eda_cr_name }}). Skipping operator reconcile.
      CASC install will ensure decision environments, projects, and activations exist.
  when: aap_eda_install_skip | bool

- name: Show AAP EDA connection details
  ansible.builtin.debug:
    msg:
      - "EDA CR: {{ aap_eda_cr_name }} (namespace {{ aap_eda.namespace }})"
      - "EDA API service: http://{{ aap_eda.instance_name }}-eda-api.{{ aap_eda.namespace }}.svc:8000"
      - "EDA event streams prefix: /eda-event-streams"
