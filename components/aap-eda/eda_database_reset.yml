---
- name: Tear down EDA workloads before database reset
  ansible.builtin.include_tasks: eda_teardown_for_reset.yml

- name: Locate AAP shared Postgres pod for EDA database reset
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ aap_eda.namespace }}"
    label_selectors:
      - "{{ aap_eda.postgres_pod_label_selector }}"
  register: aap_eda_postgres_pods

- name: Fail when Postgres pod is missing for EDA database reset
  ansible.builtin.fail:
    msg: >-
      No Postgres pod found in {{ aap_eda.namespace }} with selector
      {{ aap_eda.postgres_pod_label_selector }}. Cannot reset EDA database
      {{ aap_eda.database_name }}.
  when: aap_eda_postgres_pods.resources | default([]) | length == 0

- name: Read AAP Postgres admin password secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ aap_eda.postgres_admin_secret }}"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_postgres_admin_secret

- name: Fail when Postgres admin secret is missing for EDA database reset
  ansible.builtin.fail:
    msg: >-
      Secret {{ aap_eda.postgres_admin_secret }} not found in
      {{ aap_eda.namespace }}. Cannot reset EDA database {{ aap_eda.database_name }}.
  when: aap_eda_postgres_admin_secret.resources | default([]) | length == 0

- name: Drop and recreate EDA database
  block:
    - name: Terminate active sessions on EDA database
      kubernetes.core.k8s_exec:
        namespace: "{{ aap_eda.namespace }}"
        pod: "{{ aap_eda_postgres_pods.resources[0].metadata.name }}"
        container: postgres
        command: >-
          bash -lc
          "PGPASSWORD='{{ aap_eda_postgres_admin_secret.resources[0].data[aap_eda.postgres_admin_password_key] | b64decode }}'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity
          WHERE datname = '{{ aap_eda.database_name }}' AND pid <> pg_backend_pid();\""
      changed_when: false
      failed_when: false

    - name: Drop EDA database
      kubernetes.core.k8s_exec:
        namespace: "{{ aap_eda.namespace }}"
        pod: "{{ aap_eda_postgres_pods.resources[0].metadata.name }}"
        container: postgres
        command: >-
          bash -lc
          "PGPASSWORD='{{ aap_eda_postgres_admin_secret.resources[0].data[aap_eda.postgres_admin_password_key] | b64decode }}'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c \"DROP DATABASE IF EXISTS {{ aap_eda.database_name }};\""
      register: aap_eda_db_drop
      failed_when: aap_eda_db_drop.rc | default(1) != 0

    - name: Recreate empty EDA database
      kubernetes.core.k8s_exec:
        namespace: "{{ aap_eda.namespace }}"
        pod: "{{ aap_eda_postgres_pods.resources[0].metadata.name }}"
        container: postgres
        command: >-
          bash -lc
          "PGPASSWORD='{{ aap_eda_postgres_admin_secret.resources[0].data[aap_eda.postgres_admin_password_key] | b64decode }}'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c \"CREATE DATABASE {{ aap_eda.database_name }} OWNER {{ aap_eda.database_owner }};\""
      register: aap_eda_db_create
      failed_when: aap_eda_db_create.rc | default(1) != 0

- name: Remove EDA operator-managed secrets so encryption keys are regenerated
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ aap_eda.namespace }}"
  loop:
    - "{{ aap_eda.instance_name }}-eda-db-fields-encryption-secret"
    - "{{ aap_eda.instance_name }}-eda-admin-password"
  loop_control:
    label: "{{ item }}"
  failed_when: false
