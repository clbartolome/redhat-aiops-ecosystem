---
- name: Set EDA custom resource name for teardown
  ansible.builtin.set_fact:
    aap_eda_cr_name: "{{ aap_eda_cr_name | default(aap_eda.instance_name ~ '-eda') }}"
    aap_eda_deployment_names: >-
      {{
        aap_eda_deployment_names | default([
          aap_eda.instance_name ~ '-eda-api',
          aap_eda.instance_name ~ '-eda-activation-worker',
          aap_eda.instance_name ~ '-eda-default-worker',
          aap_eda.instance_name ~ '-eda-event-stream',
        ])
      }}

- name: Read Ansible Automation Platform EDA state before teardown
  kubernetes.core.k8s_info:
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ aap_eda.instance_name }}"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_teardown_aap_instance

- name: Disable EDA before workload teardown when currently enabled
  kubernetes.core.k8s:
    state: present
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ aap_eda.instance_name }}"
    namespace: "{{ aap_eda.namespace }}"
    merge_type: merge
    definition:
      spec:
        eda:
          disabled: true
  when:
    - aap_eda_teardown_aap_instance.resources | default([]) | length > 0
    - not (aap_eda_teardown_aap_instance.resources[0].spec.eda.disabled | default(false) | bool)

- name: Remove Event-Driven Ansible custom resource during teardown
  kubernetes.core.k8s:
    state: absent
    api_version: eda.ansible.com/v1alpha1
    kind: EDA
    name: "{{ aap_eda_cr_name }}"
    namespace: "{{ aap_eda.namespace }}"
    wait: true
    wait_timeout: 300
  failed_when: false

- name: Wait for AAP EDA Deployments removal during teardown
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ aap_eda.namespace }}"
  register: aap_eda_teardown_deployment_wait
  until: aap_eda_teardown_deployment_wait.resources | default([]) | length == 0
  retries: 24
  delay: 10
  failed_when: false
  loop: "{{ aap_eda_deployment_names | unique }}"
  loop_control:
    label: "{{ item }}"

- name: Remove remaining AAP EDA Deployments during teardown
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.item }}"
    namespace: "{{ aap_eda.namespace }}"
    wait: true
    wait_timeout: 120
  loop: "{{ aap_eda_teardown_deployment_wait.results | default([]) }}"
  when: item.resources | default([]) | length > 0
  loop_control:
    label: "{{ item.item | default('unknown') }}"

- name: Remove lingering EDA pods during teardown
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ aap_eda.namespace }}"
    label_selectors:
      - app.kubernetes.io/name=ansible-eda
  failed_when: false
