apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ observability.namespace }}-prometheus"
  labels:
    app.kubernetes.io/part-of: "{{ observability.part_of_label }}"
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
  - apiGroups: [monitoring.coreos.com]
    resources:
      - servicemonitors
      - podmonitors
      - probes
      - prometheusrules
    verbs: [get, list, watch]
