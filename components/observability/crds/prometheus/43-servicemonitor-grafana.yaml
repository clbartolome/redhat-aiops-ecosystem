apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana
  namespace: "{{ observability.namespace }}"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: "{{ observability.part_of_label }}"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
