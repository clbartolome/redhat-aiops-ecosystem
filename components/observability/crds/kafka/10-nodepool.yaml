apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: "{{ observability.namespace }}"
  labels:
    strimzi.io/cluster: "{{ observability.kafka_cluster_name }}"
    app.kubernetes.io/part-of: "{{ observability.part_of_label }}"
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
