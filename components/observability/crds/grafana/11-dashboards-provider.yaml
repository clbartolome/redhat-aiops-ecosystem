apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: "{{ observability.namespace }}"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: "{{ observability.part_of_label }}"
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: aiops
        orgId: 1
        folder: AIOps
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/aiops
