              "expr": "label_replace(label_replace(label_replace(label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"prometheus-operated\"}, \"id\", \"prometheus\", \"\", \"\"), \"title\", \"Prometheus\", \"\", \"\"), \"subtitle\", \":9090\", \"\", \"\"), \"icon\", \"chart-line\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"alertmanager-operated\"}, \"id\", \"alertmanager\", \"\", \"\"), \"title\", \"Alertmanager\", \"\", \"\"), \"subtitle\", \":9093\", \"\", \"\"), \"icon\", \"bell\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"otel-collector-upstream\"}, \"id\", \"otel-up\", \"\", \"\"), \"title\", \"OTel Upstream\", \"\", \"\"), \"subtitle\", \":8090-8093\", \"\", \"\"), \"icon\", \"share-alt\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(probe_success{job=\"observability-kafka-tcp\"}, \"id\", \"kafka\", \"\", \"\"), \"title\", \"Kafka\", \"\", \"\"), \"subtitle\", \":9092\", \"\", \"\"), \"icon\", \"database\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"otel-collector-downstream\"}, \"id\", \"otel-down\", \"\", \"\"), \"title\", \"OTel Downstream\", \"\", \"\"), \"subtitle\", \"Kafka consume\", \"\", \"\"), \"icon\", \"exchange\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"loki\"}, \"id\", \"loki\", \"\", \"\"), \"title\", \"Loki\", \"\", \"\"), \"subtitle\", \":3100\", \"\", \"\"), \"icon\", \"file-alt\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"grafana\"}, \"id\", \"grafana\", \"\", \"\"), \"title\", \"Grafana\", \"\", \"\"), \"subtitle\", \":3000\", \"\", \"\"), \"icon\", \"monitor\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(probe_success{job=\"observability-eda-http\"}, \"id\", \"eda\", \"\", \"\"), \"title\", \"AAP EDA\", \"\", \"\"), \"subtitle\", \"aiops.alertmanager\", \"\", \"\"), \"icon\", \"bolt\", \"\", \"\")",
              "format": "table",
