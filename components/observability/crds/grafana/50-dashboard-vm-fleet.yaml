          "pluginVersion": "11.3.0",
          "targets": [
            {
              "refId": "CPU",
              "expr": "100 * sum by (name) (rate(kubevirt_vmi_cpu_usage_seconds_total{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"}[5m])) / sum by (name) (kubevirt_vmi_vcpu_seconds_total{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "MEM",
              "expr": "100 * sum by (name) (kubevirt_vmi_memory_domain_bytes{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"} - kubevirt_vmi_memory_available_bytes{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"}) / sum by (name) (kubevirt_vmi_memory_domain_bytes{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "DISK",
              "expr": "100 * max by (name) (kubevirt_vmi_filesystem_used_bytes{namespace=\"{{ aap_casc.aiops_demo_namespace }}\",mount_point=\"/\"} / kubevirt_vmi_filesystem_capacity_bytes{namespace=\"{{ aap_casc.aiops_demo_namespace }}\",mount_point=\"/\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "IOPS",
              "expr": "sum by (name) (rate(kubevirt_vmi_storage_iops_read_total{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"}[5m]) + rate(kubevirt_vmi_storage_iops_write_total{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"}[5m]))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "NET",
              "expr": "sum by (name) (rate(kubevirt_vmi_network_traffic_bytes_total{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"}[5m]))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "LAT",
              "expr": "label_replace(probe_duration_seconds{job=\"apache-http\"}, \"name\", \"$1\", \"vm_name\", \"(.*)\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "PROBE",
              "expr": "label_replace(probe_success{job=\"apache-http\"}, \"name\", \"$1\", \"vm_name\", \"(.*)\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "ALERTS",
              "expr": "label_replace(sum by (vm_name) (ALERTS{alertstate=\"firing\", vm_name!=\"\"}), \"name\", \"$1\", \"vm_name\", \"(.*)\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "STATUS",
              "expr": "((count by (name) (label_replace(ALERTS{alertstate=\"firing\",vm_name!=\"\"}, \"name\", \"$1\", \"vm_name\", \"(.*)\")) > bool 0) * 0) or ((label_replace(probe_success{job=\"apache-http\"}, \"name\", \"$1\", \"vm_name\", \"(.*)\") == bool 0) * 2) or ((label_replace(probe_success{job=\"apache-http\"}, \"name\", \"$1\", \"vm_name\", \"(.*)\") == bool 1) * 1) or ((group by (name) (kubevirt_vmi_memory_available_bytes{namespace=\"{{ aap_casc.aiops_demo_namespace }}\"})) * 0 + 1)",
              "format": "table",
              "instant": true
            }
          ],
