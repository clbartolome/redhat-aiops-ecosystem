              "expr": "label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e1\", \"\", \"\"), \"source\", \"prometheus\", \"\", \"\"), \"target\", \"alertmanager\", \"\", \"\"), \"mainstat\", \"alerts :9093\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e2\", \"\", \"\"), \"source\", \"alertmanager\", \"\", \"\"), \"target\", \"otel-up\", \"\", \"\"), \"mainstat\", \"webhook :8090\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e3\", \"\", \"\"), \"source\", \"otel-up\", \"\", \"\"), \"target\", \"kafka\", \"\", \"\"), \"mainstat\", \"Kafka produce\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e4\", \"\", \"\"), \"source\", \"kafka\", \"\", \"\"), \"target\", \"otel-down\", \"\", \"\"), \"mainstat\", \"Kafka consume\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e5\", \"\", \"\"), \"source\", \"otel-down\", \"\", \"\"), \"target\", \"loki\", \"\", \"\"), \"mainstat\", \"OTLP :3100\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e6\", \"\", \"\"), \"source\", \"prometheus\", \"\", \"\"), \"target\", \"grafana\", \"\", \"\"), \"mainstat\", \"PromQL :9090\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e7\", \"\", \"\"), \"source\", \"loki\", \"\", \"\"), \"target\", \"grafana\", \"\", \"\"), \"mainstat\", \"LogQL :3100\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(vector(1), \"id\", \"e8\", \"\", \"\"), \"source\", \"kafka\", \"\", \"\"), \"target\", \"eda\", \"\", \"\"), \"mainstat\", \"aiops.alertmanager\", \"\", \"\")",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "renameByRegex",
              "options": {
                "regex": "Value #nodes",
                "renamePattern": "mainstat"
              }
            }
          ]
