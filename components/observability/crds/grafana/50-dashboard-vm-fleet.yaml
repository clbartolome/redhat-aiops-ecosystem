                  "Value #MEM": "Memory %",
                  "Value #DISK": "Disk %",
                  "Value #IOPS": "IOPS",
                  "Value #NET": "Network",
                  "Value #LAT": "Latency",
                  "Value #PROBE": "Service",
                  "Value #ALERTS": "Active Alerts",
                  "Value #STATUS": "Status"
                },
                "indexByName": {
                  "VM": 0,
                  "Status": 1,
                  "CPU %": 2,
                  "Memory %": 3,
                  "Disk %": 4,
                  "IOPS": 5,
                  "Network": 6,
                  "Latency": 7,
                  "Service": 8,
                  "Active Alerts": 9
                }
              }
            }
