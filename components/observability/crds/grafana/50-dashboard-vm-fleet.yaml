                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "color": "red",
                            "text": "DOWN",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "color": "green",
                            "text": "UP",
                            "index": 1
                          }
                        }
                      }
                    ]
