          "pluginVersion": "11.3.0",
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"prometheus-operated\"}, \"component\", \"Prometheus\", \"\", \"\") or label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"alertmanager-operated\"}, \"component\", \"Alertmanager\", \"\", \"\") or label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"otel-collector-upstream\"}, \"component\", \"OTel Upstream\", \"\", \"\") or label_replace(probe_success{job=\"observability-kafka-tcp\"}, \"component\", \"Kafka\", \"\", \"\") or label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"otel-collector-downstream\"}, \"component\", \"OTel Downstream\", \"\", \"\") or label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"loki\"}, \"component\", \"Loki\", \"\", \"\") or label_replace(up{namespace=\"{{ observability.namespace }}\", job=\"grafana\"}, \"component\", \"Grafana\", \"\", \"\") or label_replace(probe_success{job=\"observability-eda-http\"}, \"component\", \"AAP EDA\", \"\", \"\")",
              "format": "table",
