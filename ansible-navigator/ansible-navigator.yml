---
ansible-navigator:
  ansible:
    inventory:
      entries:
      - ./inventory
  app: run
  editor:
    command: vim_from_setting
    console: false
  execution-environment:
    container-engine: podman
    image: localhost/rh-aiops-ee:latest
    pull:
      policy: missing
    environment-variables:
      pass:
        - KUBECONFIG
      set:
        KUBECONFIG: /root/.kube/config
    volume-mounts:
      - src: "~/.kube"
        dest: "/root/.kube"
        options: Z
      # Mount repo root at the same absolute path inside the EE (update dest if your checkout path differs).
      # Required for playbooks under deploy/playbooks/casc/ to find deploy/roles and deploy/group_vars.
      - src: ".."
        dest: "/home/rafsanch/Documents/Projects/redhat-aiops-ecosystem"
        options: Z
  logging:
    append: true
    file: /tmp/navigator/ansible-navigator.log
    level: debug
  playbook-artifact:
    enable: false
