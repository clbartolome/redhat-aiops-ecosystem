---
ansible-navigator:
  ansible:
    inventory:
      entries:
      - ./inventory
  app: run
  editor:
    command: vim_from_setting
    console: false
  execution-environment:
    container-engine: podman
    image: localhost/rh-aiops-ee:latest
    pull:
      policy: missing
    environment-variables:
      set:
        KUBECONFIG: /root/.kube/config
    volume-mounts:
      - src: "~/.kube"
        dest: "/root/.kube"
        options: Z
  logging:
    append: true
    file: /tmp/navigator/ansible-navigator.log
    level: debug
  playbook-artifact:
    enable: false
